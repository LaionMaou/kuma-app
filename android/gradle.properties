# Gradle Daemon and JVM configuration
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX configuration
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Modern AGP 9.x+ & Gradle 9.x configuration
android.newDsl=true
android.enableAppCompileTimeRClass=true
android.usesSdkInManifest.disallowed=true
android.builtInKotlin=true
android.r8.optimizedResourceShrinking=true
android.defaults.buildfeatures.resvalues=false
android.sdk.defaultTargetSdkToCompileSdkIfUnset=true

# Suppress obsolete AGP warnings if any older plugins or third-party tools inspect legacy APIs
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL
